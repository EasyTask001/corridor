name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - run: pnpm format:check

  integration:
    name: RLS integration (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies migrations + seed.sql)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - name: Export local credentials
        # `supabase status -o env` wraps values in literal double quotes; strip them.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:55321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres"
            echo "DIRECT_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres"
          } >> "$GITHUB_ENV"
      - run: pnpm db:seed
      - run: pnpm turbo run test:integration
      - if: always()
        run: supabase stop --no-backup

  build:
    name: Build web
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
