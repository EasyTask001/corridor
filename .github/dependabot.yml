version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Winnipeg
    open-pull-requests-limit: 10
    groups:
      pnpm-production:
        dependency-type: production
      pnpm-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Winnipeg
    open-pull-requests-limit: 5
