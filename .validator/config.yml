# Ordered list of CLI agents to try for reviews
cli:
  default_preference:
    - claude
    - codex
    - cursor
    - opencode
  # Recommended settings (see docs/eval-results.md)
  adapters:
    claude:
      allow_tool_use: false
      thinking_budget: high
    codex:
      allow_tool_use: false
      thinking_budget: medium
    cursor:
      allow_tool_use: false
      thinking_budget: low
      model: codex
    opencode:
      allow_tool_use: false
      thinking_budget: low

# entry_points configured by /validator-setup
entry_points:
  # Root: mirrors the CI "check" job. Turbo caches unchanged workspaces, so
  # these stay cheap when only one package changed.
  - path: .
    checks:
      - lint:
          command: pnpm lint
      - typecheck:
          command: pnpm typecheck
      - test:
          command: pnpm test
      - format-check:
          command: pnpm format:check
      - build-web:
          command: pnpm turbo run build --filter=web
          run_locally: false
          timeout: 900
      - security-deps:
          command: pnpm audit --audit-level=moderate
          run_locally: false
    reviews:
      - all-reviewers:
          builtin: all-reviewers
          num_reviews: 4
          model: gpt-5.3-codex

  # Schema changes: migrations are the source of truth, the drizzle mirror
  # must match, and RLS is verified by the integration suite. All three need
  # the local Supabase stack (pnpm db:start) to be running.
  - path: supabase
    checks:
      - db-lint:
          command: pnpm db:lint
      - db-verify-mirror:
          command: pnpm --filter @corridor/db verify:mirror
      - test-integration:
          command: pnpm test:integration
          timeout: 900

  - path: packages/db
    checks:
      - db-lint
      - db-verify-mirror
      - test-integration

# -------------------------------------------------------------------
# All settings below are optional. Uncomment and change as needed.
# -------------------------------------------------------------------

# Git ref for detecting local changes via git diff (default: origin/main)
# base_branch: origin/main

# Directory for per-job logs (default: validator_logs)
# log_dir: validator_logs

# Run gates in parallel when possible (default: true)
# allow_parallel: true

# Maximum retry attempts before declaring "Retry limit exceeded" (default: 3)
# max_retries: 3

# Archived session directories to keep during log rotation (default: 3, 0 = disable)
# max_previous_logs: 3

# Priority threshold for filtering new violations during reruns (default: medium)
# Options: critical, high, medium, low
# rerun_new_issue_threshold: medium

# Debug log — persistent debug logging to .debug.log
# debug_log:
#   enabled: false
#   max_size_mb: 10               # Max size before rotation to .debug.log.1

# Structured logging via LogTape
# logging:
#   level: debug                  # Options: debug, info, warning, error
#   console:
#     enabled: true
#     format: pretty              # Options: pretty, json
#   file:
#     enabled: true
#     format: text                # Options: text, json
